name: ProCoach Flutter CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Static Code Analysis & Automated Test Suite (Unit, DB, API, Widget)
  # ---------------------------------------------------------------------------
  verify_and_test:
    name: Analyze & Run Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SQLite3 Native Library for Linux Test Runner
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting & Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute Unit, SQLite DB, Supabase Contract & Widget Tests
        run: flutter test --coverage

  # ---------------------------------------------------------------------------
  # JOB 2: Build Production Android Release APK & AppBundle (Obfuscated)
  # ---------------------------------------------------------------------------
  build_android_release:
    name: Build Production Android APK
    needs: verify_and_test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Obfuscated Production APK with Secure Dart-Defines
        run: |
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://pnuyylukurndiflgzxmo.supabase.co' }} \
            --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY || 'sb_publishable_WwWRmaKsCVi9tlvlH3Kf1g_63q_rlid' }}

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProCoach-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
