name: MaxGym CI/CD (Android Release APK + Cloudflare/GitHub Pages PWA)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: Run Automated Tests
  # ---------------------------------------------------------------------------
  test_suite:
    name: Run MaxGym Automated Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite3 Native Dev Lib
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: flutter test

  # ---------------------------------------------------------------------------
  # JOB 2: Build Production Android APK & Publish Official GitHub Release
  # ---------------------------------------------------------------------------
  build_android:
    name: Build MaxGym Release APK & Publish Release
    needs: test_suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get

      - name: Configure Production Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          else
            keytool -genkey -v -keystore android/app/upload-keystore.jks \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias maxgym_release \
              -storepass MaxGymReleaseKey2026 -keypass MaxGymReleaseKey2026 \
              -dname "CN=MaxGym, OU=Fitness, O=MaxGym, L=Tehran, S=Tehran, C=IR"
            cat <<EOF > android/key.properties
          storePassword=MaxGymReleaseKey2026
          keyPassword=MaxGymReleaseKey2026
          keyAlias=maxgym_release
          storeFile=upload-keystore.jks
          EOF
          fi

      - name: Upgrade AGP & Gradle Wrapper and Build Obfuscated Release APK
        run: |
          # ۱. ارتقای خودکار نسخه AGP از 9.1.0 به 9.1.1 در settings.gradle(.kts)
          if [ -f "android/settings.gradle.kts" ]; then
            sed -i 's/version "9.1.0"/version "9.1.1"/g' android/settings.gradle.kts
          fi
          if [ -f "android/settings.gradle" ]; then
            sed -i 's/version "9.1.0"/version "9.1.1"/g' android/settings.gradle
          fi
          # ۲. ارتقای خودکار Gradle Wrapper به 9.5
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's/gradle-9.3.1-all.zip/gradle-9.5-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
            sed -i 's/gradle-9.3.1-bin.zip/gradle-9.5-bin.zip/g' android/gradle/wrapper/gradle-wrapper.properties
          fi
          # ۳. کامپایل نسخه نهایی با فلگ ضد خطای وابستگی گرادل
          flutter build apk --release \
            --android-skip-build-dependency-validation \
            --obfuscate \
            --split-debug-info=build/symbols \
            --dart-define=APP_DOMAIN=maxgym.privatepath.ir \
            --dart-define=GITHUB_REPO=MasoudMaghsodi/MaxGym

      - name: Prepare MaxGym-Release.apk
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MaxGym-Release.apk

      - name: Upload MaxGym-Release.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxGym-Release-APK
          path: build/app/outputs/flutter-apk/MaxGym-Release.apk

      - name: Create or Update Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.2.0
          name: "MAX GYM Official Release v1.2.0"
          make_latest: true
          body: |
            ## 🏋️‍♂️ MAX GYM Official Production Release (Android APK)
            ### **NO PAIN NO GAIN • EST. 2019**
            
            * **Version:** 1.2.0
            * **Web & iOS PWA Portal:** [https://maxgym.privatepath.ir](https://maxgym.privatepath.ir)
            * **Direct APK Download:** [MaxGym-Release.apk](https://github.com/MasoudMaghsodi/MaxGym/releases/download/v1.2.0/MaxGym-Release.apk)
            
            ### 📱 Highlights:
            - OWASP Zero-Trust Hardened Security & RLS
            - Cyber-Athletic Bento & Glass UI 2.0
            - Self-hosted CanvasKit WebAssembly (Loads in Iran without VPN)
            - Dual-role Coach management & Athlete online portal (`PC-XXXXXX`).
            - Offline-first SQLite database with automatic two-way Delta Supabase sync.
          files: build/app/outputs/flutter-apk/MaxGym-Release.apk
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # JOB 3: Build & Auto-Deploy Web PWA to GitHub Pages (maxgym.privatepath.ir)
  # ---------------------------------------------------------------------------
  deploy_web_pwa:
    name: Deploy iOS/Web PWA to GitHub Pages
    needs: test_suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Replace Default Flutter Web Icons with Official MAX GYM Logo
        run: |
          cp assets/images/maxgym_logo.jpeg web/favicon.png
          cp assets/images/maxgym_logo.jpeg web/icons/Icon-192.png
          cp assets/images/maxgym_logo.jpeg web/icons/Icon-512.png
          cp assets/images/maxgym_logo.jpeg web/icons/Icon-maskable-192.png
          cp assets/images/maxgym_logo.jpeg web/icons/Icon-maskable-512.png
      - name: Build Flutter Web PWA (Self-Hosted CanvasKit for No-VPN Access)
        run: |
          flutter build web --release \
            --base-href "/" \
            --dart-define=FLUTTER_WEB_CANVASKIT_URL=/canvaskit/ \
            --dart-define=APP_DOMAIN=maxgym.privatepath.ir \
            --dart-define=GITHUB_REPO=MasoudMaghsodi/MaxGym
          mkdir -p build/web/canvaskit
          if [ -d "$FLUTTER_ROOT/bin/cache/flutter_web_sdk/canvaskit" ]; then
            cp -r $FLUTTER_ROOT/bin/cache/flutter_web_sdk/canvaskit/* build/web/canvaskit/ 2>/dev/null || true
          fi
      - name: Configure Custom Domain (CNAME), Cache-Buster & SPA 404 Fallback
        run: |
          echo "maxgym.privatepath.ir" > build/web/CNAME
          cp build/web/index.html build/web/404.html
          BUILD_TS=$(date +%s)
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.js?v=${BUILD_TS}/g" build/web/index.html
          sed -i "s/flutter_bootstrap.js/flutter_bootstrap.js?v=${BUILD_TS}/g" build/web/404.html
      - name: Publish to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          cname: maxgym.privatepath.ir
